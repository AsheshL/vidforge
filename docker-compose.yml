services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vidforge
      POSTGRES_PASSWORD: vidforge
      POSTGRES_DB: vidforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    # minio/minio is no longer published to Docker Hub; pgsty/minio is a
    # maintained community build of the same server (mc included).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vidforge
      MINIO_ROOT_PASSWORD: vidforge-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Dev mail catcher: SMTP on :1025, web UI + REST API on :8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
