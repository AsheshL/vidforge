name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scoped to this job, not the whole workflow: a workflow-level
    # concurrency block would cancel the `deploy` job too on a rapid
    # second push to main — confirmed live, mid-rollout, the hard way.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vidforge
          POSTGRES_PASSWORD: vidforge
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protobuf types
        run: pnpm proto:gen

      - name: Generate Prisma client
        run: pnpm db:generate

      # Fails if schema.prisma has changes not captured in a migration,
      # so `db push` drift can't reach main.
      - name: Check migration drift
        run: pnpm db:drift-check
        env:
          SHADOW_DATABASE_URL: postgresql://vidforge:vidforge@localhost:5432/shadow

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @vidforge/web build
        env:
          # Build-time only; runtime values come from the deploy environment.
          NEXT_PUBLIC_GATEWAY_URL: http://localhost:4000

  deploy:
    name: Deploy to ECS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No long-lived AWS keys in repository secrets — this role trusts
      # only GitHub Actions runs on this repo's main branch (see
      # infra/terraform/ci-cd.tf).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and push images
        run: infra/scripts/build-and-push.sh

      - name: Run migration and deploy all services
        run: infra/scripts/ecs-ci-deploy.sh
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          PRIVATE_SUBNETS: ${{ vars.ECS_PRIVATE_SUBNETS }}
          APP_SECURITY_GROUP: ${{ vars.ECS_APP_SECURITY_GROUP }}
